name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'did:iden3:billions:main:2VqmdRLQ87p5Pz4N4zVPHaPmNAYzZ2p8e2w5Nn6pb7'
        required: true
        default: 'did:iden3:billions:main:2VqmdRLQ87p5Pz4N4zVPHaPmNAYzZ2p8e2w5Nn6pb7'
      agent_description:
        description: 'did:iden3:billions:main:2VqmdRLQ87p5Pz4N4zVPHaPmNAYzZ2p8e2w5Nn6pb7'
        required: true
        default: 'did:iden3:billions:main:2VqmdRLQ87p5Pz4N4zVPHaPmNAYzZ2p8e2w5Nn6pb7 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: cd scripts; npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{
            "name": "did:iden3:billions:main:2VqmdRLQ87p5Pz4N4zVPHaPmNAYzZ2p8e2w5Nn6pb7",
            "description": "did:iden3:billions:main:2VqmdRLQ87p5Pz4N4zVPHaPmNAYzZ2p8e2w5Nn6pb7 AI Agent"
          }'
